org.gradle.caching=true
org.gradle.configuration-cache=true
# For Wasm
# 4 GB needed for compiling the Wasm target
org.gradle.jvmargs=-Xmx4G
# For the `composeUi` custom source sets
#kotlin.mpp.applyDefaultHierarchyTemplate=false
# For Android
android.useAndroidX=true
# AGP 9.5 Compose Preview runfiles currently require release unit tests.
# TODO Remove this and the app's test-resource override when Preview works without them.
android.onlyEnableUnitTestForTheTestedBuildType=false
kotlin.native.enableKlibsCrossCompilation=true